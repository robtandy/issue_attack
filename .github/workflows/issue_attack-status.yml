# Deployed by issue_attack — publishes the agent fleet status page.
# Every status publish force-pushes gh-pages; this workflow deploys it.
# (Actions-based deploys are not subject to the ~10/hour Pages build limit.)
name: issue_attack status page
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *" # safety net: redeploy latest state if a run was cancelled
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deploy
        uses: actions/deploy-pages@v4
